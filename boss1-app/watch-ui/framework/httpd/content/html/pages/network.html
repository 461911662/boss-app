<!-- 网络设置页面 -->
<div class="card" id="network">
    <h2>网络设置</h2>
    
    <!-- WiFi 状态 -->
    <div class="network-section">
        <h3>WiFi 状态</h3>
        <div class="network-status">
            <div class="status-item">
                <span class="status-label">连接状态</span>
                <span class="status-value" id="wifi-status">已连接</span>
            </div>
            <div class="status-item">
                <span class="status-label">当前网络</span>
                <span class="status-value" id="wifi-ssid">BOSS1-HOME</span>
            </div>
            <div class="status-item">
                <span class="status-label">信号强度</span>
                <span class="status-value" id="wifi-signal">强</span>
            </div>
        </div>
    </div>
    
    <div class="divider"></div>
    
    <!-- WiFi 列表 -->
    <div class="network-section">
        <h3>可用网络</h3>
        <div class="wifi-list" id="wifi-list">
            <div class="wifi-item">
                <div class="wifi-info">
                    <span class="wifi-name">BOSS1-HOME</span>
                    <span class="wifi-signal strong">信号强</span>
                </div>
                <button class="btn btn-small">已连接</button>
            </div>
            <div class="wifi-item">
                <div class="wifi-info">
                    <span class="wifi-name">Guest-Network</span>
                    <span class="wifi-signal medium">信号中</span>
                </div>
                <button class="btn btn-small btn-outline">连接</button>
            </div>
            <div class="wifi-item">
                <div class="wifi-info">
                    <span class="wifi-name">Office-5G</span>
                    <span class="wifi-signal weak">信号弱</span>
                </div>
                <button class="btn btn-small btn-outline">连接</button>
            </div>
        </div>
    </div>
    
    <div class="divider"></div>
    
    <!-- 手动添加网络 -->
    <div class="network-section">
        <h3>手动添加</h3>
        <form id="add-wifi-form">
            <div class="form-group">
                <label class="form-label" for="wifi-ssid-input">网络名称 (SSID)</label>
                <input type="text" id="wifi-ssid-input" class="form-input" placeholder="请输入WiFi名称" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="wifi-password-input">密码</label>
                <input type="password" id="wifi-password-input" class="form-input" placeholder="请输入WiFi密码">
            </div>
            <button type="submit" class="btn btn-primary">添加网络</button>
        </form>
    </div>
</div>
